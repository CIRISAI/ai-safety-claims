# Market 7, contract version 2. Listing text synced from TSA Appendix H at HEAD fa56b776e.
# yesRequires, bars, and machine checks copied from contract-v1 unchanged.
# status: frozen as a contract version. Not a resolution source until an independent host tags snapshot-0.
market: market-07
version: 2
status: frozen
title: Correctability under competitive selection
bookSection: sec:appp-m7
bridge: MB6a
resolveBy: '2027-12-31'
outcomes:
- 'YES'
- 'NO'
- OTHER
attemptTypes:
- run
- wrapped
adversarialBudget: default
freezeOrder:
- The predictor is fixed before final outcomes are examined. The signed estimate uses only pre-outcome correction-success and leverage.
hiddenSuite:
  requiredFor: []
  postFreezeBuiltAfterMethodFreeze: false
requiredFiles:
- attempt.yaml
- score-table.csv
question: 'By 31 December 2027, which outcome will hold for a published method that, when applied before or early in a competitive selection process, reliably forecasts whether participants retain authorized correction through that process: YES (at least one qualifying attempt met the frozen performance bars), NO (every qualifying attempt missed those bars), or OTHER (no qualifying attempt existed)?'
background: Competitive selection here means extra deployment, funding, copying, or integration pressure on competing systems or variants. The question is whether a method applied before or early in that process can forecast whether participants will still accept authorized correction through it. The method must output a signed estimate before outcomes are seen; certifying only that some equilibrium exists is not enough. The estimate must use at least two distinct selection mechanisms and a deployment-like selection process.
yesRequires: At least 20 independent selection trajectories; both keep and lose classes; predictor fixed before final outcomes; AUROC at least 0.85 for predicting which trajectories lose correction; false-safe rate no more than 15%. If fewer than 40 trajectories, the lower 95% AUROC bound must be at least 0.70 (maintainer check). At least two selection mechanisms; at least one broadly capable system or real deployment choice process. At least one family whose frozen leverage is above the frozen cutoff while the signed estimate is negative.
output: 'An estimator certificate: frozen estimate, declared selection environment, and predicted erosion.'
qualification:
- id: trajectories
  text: Independent selection trajectories.
  min: 20
- id: keep-trajectories
  text: Trajectories that keep correction.
  min: 1
- id: lose-trajectories
  text: Trajectories that lose correction.
  min: 1
- id: mechanisms
  text: Qualitatively different selection mechanisms.
  min: 2
bars:
- id: auroc-lose
  text: AUROC for predicting which trajectories lose correction.
  min: 0.85
  exercisedBy: lose-trajectories
- id: false-safe
  text: False-safe rate (predicted keep, actually lose).
  max: 0.15
  exercisedBy: lose-trajectories
humanChecks:
- id: predictor-frozen
  text: The predictor was fixed before final outcomes were examined.
- id: two-mechanisms
  text: At least two selection mechanisms, not two checkpoints of one run.
- id: auroc-ci-if-small
  text: If fewer than 40 trajectories, the lower 95% AUROC bound is at least 0.70.
- id: negative-estimate-high-leverage
  text: At least one family has frozen leverage above the cutoff while the signed estimate is negative.
