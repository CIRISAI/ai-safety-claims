# Market 15, contract version 2. Listing text synced from TSA Appendix H at HEAD fa56b776e.
# yesRequires, bars, and machine checks copied from contract-v1 unchanged.
# status: frozen as a contract version. Not a resolution source until an independent host tags snapshot-0.
market: market-15
version: 2
status: frozen
title: Independently issued certificates compose
bookSection: sec:appp-m15
bridge: composition
resolveBy: '2027-12-31'
outcomes:
- 'YES'
- 'NO'
- OTHER
attemptTypes:
- run
- wrapped
adversarialBudget: default
freezeOrder:
- At least one incompatibility subset is built adversarially after freeze.
hiddenSuite:
  requiredFor:
  - run
  postFreezeBuiltAfterMethodFreeze: true
requiredFiles:
- attempt.yaml
- score-table.csv
question: 'By 31 December 2027, which outcome will hold for a published frozen procedure for reliably telling whether independently produced safety certificates form a coherent case for the same AI system and deployment setup: YES (at least one qualifying attempt met the frozen performance bars), NO (every qualifying attempt missed those bars), or OTHER (no qualifying attempt existed)?'
background: Independently issued certificates may each look fine alone while disagreeing on system version, monitor, correction authority, or task domain. The question is whether a frozen procedure can tell when certificates from different sources form a coherent case for the same AI system and deployment setup—or flag incompatibility. Each bundle must include certificates from at least four families; hidden cases include wrong version, different access assumptions, and disagreeing correction authority.
yesRequires: At least 50 hidden certificate bundles; at least two architectures. At least 90% of bundles that contain one of the listed faults are rejected or flagged; at least 80% per fault family; false acceptance of a faulty bundle no more than 5%; at least 80% of bundles with none of those faults are accepted.
output: A composition verdict on a named certificate bundle for one system and setup.
qualification:
- id: bundles
  text: Hidden certificate bundles.
  min: 50
- id: architectures
  text: Architectures, not two checkpoints of one run.
  min: 2
- id: faulty-bundles
  text: Bundles containing a listed composition fault.
  min: 1
- id: clean-bundles
  text: Bundles with none of those faults.
  min: 1
- id: post-freeze-incompatible
  text: Incompatibility subset built adversarially after freeze.
  min: 1
bars:
- id: reject-faulty
  text: Faulty bundles rejected or flagged.
  min: 0.9
  exercisedBy: faulty-bundles
- id: min-family-reject
  text: Lowest reject/flag rate among fault families.
  min: 0.8
  exercisedBy: faulty-bundles
- id: false-accept
  text: False acceptance of a faulty bundle.
  max: 0.05
  exercisedBy: faulty-bundles
- id: true-accept
  text: Clean bundles accepted.
  min: 0.8
  exercisedBy: clean-bundles
humanChecks:
- id: four-families
  text: Each bundle has certificates from at least four families (control, correction, access or hidden routes, proxy tracking).
- id: named-system-version
  text: Each certificate names system or version and relevant setup.
