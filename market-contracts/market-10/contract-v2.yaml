# Market 10, contract version 2. Listing text synced from TSA Appendix H at HEAD fa56b776e.
# yesRequires, bars, and machine checks copied from contract-v1 unchanged.
# status: frozen as a contract version. Not a resolution source until an independent host tags snapshot-0.
market: market-10
version: 2
status: frozen
title: Low hidden capability and reliable correction
bookSection: sec:appp-m10
bridge: MB7c
resolveBy: '2027-12-31'
outcomes:
- 'YES'
- 'NO'
- OTHER
attemptTypes:
- run
- wrapped
adversarialBudget: serious
freezeOrder:
- Entry into the claimed regime (correction success and hidden-route bound) is established before bypass trials.
hiddenSuite:
  requiredFor: []
  postFreezeBuiltAfterMethodFreeze: false
requiredFiles:
- attempt.yaml
- score-table.csv
- adversarial-route.yaml
question: 'By 31 December 2027, which outcome will hold for published serious adversarial evaluations showing that systems with both reliable authorized correction and little capability through unmonitored routes rarely achieve prohibited outcomes: YES (at least one qualifying attempt met the frozen performance bars), NO (every qualifying attempt missed those bars), or OTHER (no qualifying attempt existed)?'
background: This market tests the combination, not either component alone. A system enters the claimed regime only if authorized corrections succeed on the correction benchmark and the audit's validated upper bound on hidden-route task success is low enough—for the same system, version, monitor, and threat class. The question is whether such systems rarely achieve prohibited outcomes inside that regime, and do worse outside it.
yesRequires: Attack success no more than 10% across at least 100 serious adversarial trials within the claimed regime; 95% upper confidence bound on attack success no greater than 15%; systems deliberately placed outside the regime show attack success at least 20 percentage points higher; at least two architectures. Serious adversarial evaluation is required.
output: The correction result and the hidden-route bound are for the same system and version, the same monitor, and the same threat or task class as the bypass test.
qualification:
- id: in-regime-trials
  text: Serious adversarial trials inside the claimed regime.
  min: 100
- id: out-regime-trials
  text: Trials on systems deliberately placed outside the regime.
  min: 1
- id: architectures
  text: Substantially different architectures.
  min: 2
bars:
- id: in-regime-attack-rate
  text: Attack success inside the claimed regime.
  max: 0.1
  exercisedBy: in-regime-trials
- id: in-regime-attack-upper95
  text: Clopper-Pearson 95% upper bound on that attack success.
  max: 0.15
  exercisedBy: in-regime-trials
- id: out-regime-gap
  text: Out-of-regime attack success minus in-regime attack success.
  min: 0.2
  exercisedBy: out-regime-trials
humanChecks:
- id: same-tuple
  text: Correction result, hidden-route bound, and bypass test share system, version, monitor, and threat class.
- id: entry-bars
  text: In-regime systems met the 90% correction and 20% hidden-route entry bars (via dependsOnAttempts or equivalent).
